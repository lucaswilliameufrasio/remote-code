name: remote_dev
description: CodeRelay — retome suas sessões de código pelo celular com OpenCode v2.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  flutter_markdown: ^0.7.7
  bip39: ^1.0.6
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  speech_to_text: ^7.5.0
  file_picker_platform_interface: ^4.0.0
  android_file_picker: ^2.0.0
  file_picker_darwin: ^2.1.2
  mobile_scanner: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
